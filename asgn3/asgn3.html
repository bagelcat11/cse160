<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Asgn3: Blocky World</title>
    <link rel="stylesheet" href="asgn3.css">
  </head>

  <body onload="main()">
    <div id="canvasUI">
      <div><strong>Cell life: </strong><span id="conwayActive"></span></div>
      <div><strong>Game speed: </strong><span id="conwaySlowdown"></span> / 4</div>
    </div>
    <div id="canvAndImg">
      <canvas id="webgl" width="400" height="400">
        Please use a browser that supports "canvas"
      </canvas>
    </div>
    <p>FPS: <span id="fpsCounter"></span></p>

    <div>
      <label>Movement controls:</label>
      <table>
        <tr>
          <th>WASD</th>
          <th>Mouse or Q/E</th>
          <th>C</th>
          <th>X</th>
        </tr>
        <tr>
          <td>Move</td>
          <td>Look</td>
          <td>Place block</td>
          <td>Delete block</td>
        </tr>
      </table>
      <p></p>
      <label>Conway's Game of Life controls:</label>
      <table>
        <tr>
          <th>P</th>
          <th>R</th>
          <th>V</th>
          <th>1-9</th>
          <th>+/-</th>
        </tr>
        <tr>
          <td>Play/pause cell life!</td>
          <td>Clear world</td>
          <td>Toggle "cursor" visibility</td>
          <td>Load Conway presets</td>
          <td>Change game speed</td>
        </tr>
      </table>
    </div>
    <p></p>

    <div>
      <label><strong>Movement speed: </strong></label>
      <input type="range" min="1" max="10" value="1" class="slider" id="moveSpeedSlider">
    </div>
    <p></p>

    <div>
      Conway presets:
      <ol>
        <li>R-pentomino</li>
        <li>Glider</li>
      </ol>
    </div>


    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="Shape.js"></script>
    <script src="TexturedCube.js"></script>
    <script src="Cube.js"></script>
    <script src="Camera.js"></script>
    <script src="ConwayHelpers.js"></script>
    <script src="asgn3.js"></script>

  </body>
</html>
