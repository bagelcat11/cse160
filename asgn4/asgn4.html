<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Asgn4: Lighting</title>
    <link rel="stylesheet" href="asgn4.css">
  </head>

  <body onload="main()">
    <div id="canvAndImg">
      <canvas id="webgl" width="400" height="400">
        Please use a browser that supports "canvas"
      </canvas>
    </div>
    <p>FPS: <span id="fpsCounter"></span></p>

    <div>
      <label><strong>Normal visualization: </strong></label>
      <input type="radio" id="normOn" name="normToggle" value="on"/>
      <label for="normOn">On</label>
      <input type="radio" id="normOff" name="normToggle" value="off" checked/>
      <label for="normOff">Off</label>
    </div>
    <div>
      <label><strong>Light movement: </strong></label>
      <input type="radio" id="lightAnimOn" name="lightAnimToggle" value="on" checked/>
      <label for="lightAnimOn">On</label>
      <input type="radio" id="lightAnimOff" name="lightAnimToggle" value="off"/>
      <label for="lightAnimOff">Off</label>
    </div>
    <div>
      <label><strong>Light: </strong></label>
      <input type="radio" id="lightOn" name="lightToggle" value="on" checked/>
      <label for="lightOn">On</label>
      <input type="radio" id="lightOff" name="lightToggle" value="off"/>
      <label for="lightOff">Off</label>
    </div>
    <p></p>

    <div>
      <label><strong>Light X: </strong></label>
      <input type="range" min="-16" max="16" value="0" class="slider" id="lightXSlider">
      <label><strong>Light Y: </strong></label>
      <input type="range" min="-16" max="16" value="16" class="slider" id="lightYSlider">
      <label><strong>Light Z: </strong></label>
      <input type="range" min="-16" max="16" value="0" class="slider" id="lightZSlider">
    </div>
    <p></p>
    <div>
      <label><strong>Light color: </strong>Red</label>
      <input type="range" min="0" max="100" value="100" class="slider" id="redSlider">
      <label>Green</label>
      <input type="range" min="0" max="100" value="100" class="slider" id="greenSlider">
      <label>Blue</label>
      <input type="range" min="0" max="100" value="100" class="slider" id="blueSlider">
    </div>
    <p></p>

    <div>
      <label>Movement controls:</label>
      <table>
        <tr>
          <th>WASD</th>
          <th>Mouse, Q/E</th>
        </tr>
        <tr>
          <td>Move</td>
          <td>Look</td>
        </tr>
      </table>
      <p></p>


    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="Shape.js"></script>
    <script src="Camera.js"></script>
    <script src="NormalledTexturedCube.js"></script>
    <script src="NormalledTexturedSphere.js"></script>
    <script src="asgn4.js"></script>

  </body>
</html>
